[policy_type]
permanent= Yes

[LTF]
thermal_zone= soc_max
mode= enabled

[battery-protection]
mode= enabled
sensor= battery
threshold= [36000, 38000, 40000, 42000]
hysteresis= [2000, 2000, 2000, 1000]
current= [3000, 1800, 800, 200]

[mtk-skin-control]
sensor= ap_ntc
max_target_tj= 90000
min_target_tj= 65000
trip_tpcb= 60000
target_tpcb= 65000

[charger-cooler]
mode= enabled
sensor= charge_therm
threshold= [36000, 38000, 40000, 42000]
hysteresis= [2000, 2000, 2000, 1000]
current= [2500, 1500, 500, 0]

[virtual-cluster0]
algo_type= virtual
trip_sensor= battery
set_point= 41000
set_point_clr= 44000
sensors= cpu_big1 cpu_big2 cpu_big3 cpu_big4
sampling= 10
math= 2

[virtual-cluster1]
algo_type= virtual
trip_sensor= battery
set_point= 41000
set_point_clr= 44000
sensors= cpu_little1 cpu_little2 cpu_little3 cpu_little4
sampling= 10
math= 2

[thermalhal-threshold]
type= BATTERY
sensor= battery
level= [severe, critical, emergency, shutdown]
threshold= [50000, 50000, 47000, 50000]
